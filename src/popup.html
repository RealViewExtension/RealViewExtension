<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RealView</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        width: 300px;
        margin: 0;
        padding: 16px;
        font-family: "Roboto", system-ui, -apple-system, sans-serif;
        font-size: 13px;
        background: Canvas;
        color: CanvasText;
      }
      h1 {
        margin: 0 0 2px;
        font-size: 15px;
        font-weight: 600;
      }
      p.sub {
        margin: 0 0 14px;
        opacity: 0.65;
        line-height: 1.4;
      }
      label.row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 9px 0;
        cursor: pointer;
        border-top: 1px solid color-mix(in srgb, CanvasText 15%, transparent);
      }
      label.row input {
        margin: 2px 0 0;
        accent-color: #c00;
      }
      .row-text strong {
        display: block;
        font-weight: 500;
      }
      .row-text span {
        opacity: 0.65;
        line-height: 1.35;
      }
      label.row.disabled {
        opacity: 0.45;
        cursor: default;
      }
      details.whats-new {
        padding: 9px 0;
        border-top: 1px solid color-mix(in srgb, CanvasText 15%, transparent);
      }
      details.whats-new summary {
        cursor: pointer;
        font-weight: 500;
      }
      .new-tag {
        margin-left: 6px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: #c00;
      }
      /* The extension's red is dark enough to all but vanish against a dark
         popup, and this tag is small bold text that has to be readable at a
         glance, so dark mode is given a lighter red instead. */
      @media (prefers-color-scheme: dark) {
        .new-tag {
          color: #ff5c5c;
        }
      }
      .changelog {
        margin-top: 8px;
      }
      .changelog .earlier {
        max-height: 220px;
        overflow-y: auto;
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px dashed color-mix(in srgb, CanvasText 15%, transparent);
      }
      .changelog h2 {
        margin: 0 0 3px;
        font-size: 13px;
        font-weight: 500;
      }
      .changelog h2 span {
        margin-left: 6px;
        font-weight: 400;
        opacity: 0.65;
      }
      .changelog ul {
        margin: 0 0 10px;
        padding-left: 16px;
      }
      .changelog li {
        opacity: 0.65;
        line-height: 1.35;
        overflow-wrap: break-word;
      }
      .changelog .entry:last-child ul,
      .changelog .earlier .entry:last-child ul {
        margin-bottom: 0;
      }
      button.more {
        margin-top: 8px;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        color: inherit;
        opacity: 0.65;
        text-decoration: underline;
        cursor: pointer;
      }
      footer {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid color-mix(in srgb, CanvasText 15%, transparent);
        opacity: 0.6;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <h1>RealView</h1>
    <p class="sub">Shows Engaged Views &mdash; the old 30-second view count &mdash; on the YouTube Studio analytics screens.</p>

    <label class="row">
      <input type="checkbox" id="rewrite" />
      <span class="row-text">
        <strong>Use engaged views</strong>
        <span>Replaces the view figures across Studio with engaged views, and renames the cards to match.</span>
      </span>
    </label>

    <label class="row">
      <input type="checkbox" id="color" />
      <span class="row-text">
        <strong>Red charts</strong>
        <span>Paints the analytics graphs red while engaged views are shown.</span>
      </span>
    </label>

    <label class="row">
      <input type="checkbox" id="toast" />
      <span class="row-text">
        <strong>Update notice on Studio</strong>
        <span>Shows a small card in the corner of Studio once after each update. The toolbar badge appears either way.</span>
      </span>
    </label>

    <label class="row">
      <input type="checkbox" id="debug" />
      <span class="row-text">
        <strong>Log to the console</strong>
        <span>Reports what was converted, and why a conversion was skipped.</span>
      </span>
    </label>

    <!-- Hidden until the changelog has been read and parsed, so a missing or
         broken file leaves the popup looking exactly as it did before. -->
    <details class="whats-new" id="whats-new" hidden>
      <summary id="whats-new-summary"></summary>
      <div class="changelog" id="changelog"></div>
      <button type="button" class="more" id="show-earlier" hidden>Show earlier versions</button>
    </details>

    <footer id="status">Reload YouTube Studio after changing a setting.</footer>
    <script src="popup.js"></script>
  </body>
</html>
